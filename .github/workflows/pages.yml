name: Publish apartment planner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify model and persistence
        run: node tests/model.test.js
      - name: Prepare static publishing files
        run: node prepare-pages.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
